services:
  # The Go API.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manager_app
    restart: unless-stopped
    environment:
      APP_NAME: "M.N.G.R Manager"
      PORT: "8000"
      DATABASE_URL: postgres://manager:secret@db:5432/manager?sslmode=disable
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # PostgreSQL — the database.
  db:
    image: postgres:16-alpine
    container_name: manager_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: manager
      POSTGRES_USER: manager
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manager -d manager"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Adminer — database UI at http://localhost:8080 (system "PostgreSQL", server "db", user "manager", password "secret").
  adminer:
    image: adminer
    container_name: manager_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pg_data:
